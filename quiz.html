<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz | Multimedia Systems</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="chip"><span class="cr"></span><span class="cg"></span><span class="cb"></span></span> Multimedia Systems</div>
  <nav class="mainnav">
    <a href="index.html">Module 1</a>
    <a href="module2.html">Module 2</a>
    <a href="quiz.html" class="active">Quiz</a>
  </nav>
</header>

<main class="page">

  <div class="hero">
    <p class="eyebrow">prelim · self-check</p>
    <h1>Quiz</h1>
    <p class="lead">24 objective items plus 10 computation problems pulled straight from Module 1 and Module 2. Answer everything, then grade it at the bottom.</p>
  </div>

  <div class="quiz-progress">
    <span id="progress-label">0 / 34 answered</span>
    <div class="bar"><div class="bar-fill" id="progress-fill"></div></div>
  </div>

  <div id="quiz-root"></div>

  <div class="quizbar">
    <span id="score-summary">Answer the questions above, then grade your quiz.</span>
    <button class="gradebtn" id="grade-btn">Grade quiz</button>
  </div>

</main>

<script>
/* ===================================================================
   QUESTION BANK
   type: "objective"   -> multiple choice, `correct` is the option index
   type: "computation" -> free text, checked by matchType:
       "numlist" -> compares every number found in the input, in order
       "approx"  -> compares a single number within `tolerance`
   =================================================================== */
const QUESTIONS = [

  // ---------------- OBJECTIVE (24) ----------------
  {type:"objective", prompt:"Multimedia is best defined as computer-controlled, integrated delivery of two or more media elements, often with:",
   options:["Interactivity","Encryption","Compression","Redundancy"], correct:0,
   explain:"Multimedia is a computer-controlled, integrated delivery of multiple media elements — often with interactivity that lets the user influence what is presented, and when."},

  {type:"objective", prompt:"Which pairing below is incorrect?",
   options:["Serif type — printed material","Sans serif type — digital screens","Raster graphics — math equations","Vector graphics — math equations"], correct:2,
   explain:"Raster images are made of pixels (a grid of bits); it's vector graphics that are built from math equations and paths."},

  {type:"objective", prompt:"Which of the five basic multimedia elements is described as \"the heaviest element\"?",
   options:["Text","Graphics","Video","Animation"], correct:2,
   explain:"Video carries moving images with synced audio, making it the heaviest of the five elements to store and transmit."},

  {type:"objective", prompt:"Hypertext refers to:",
   options:["Text linked non-sequentially","Text compressed for storage","Text rendered only in HTML","Text translated automatically"], correct:0,
   explain:"Hypertext is text linked non-sequentially — the clickable links that let you jump between passages."},

  {type:"objective", prompt:"The World Wide Web is considered:",
   options:["The largest hypermedia system ever built","A linear multimedia format","A raster graphics format","A subtractive color model"], correct:0,
   explain:"Hypermedia extends hypertext's non-sequential linking across every medium, and the Web is the largest such system built."},

  {type:"objective", prompt:"Which of these is NOT one of the listed characteristics of multimedia?",
   options:["Integration","Computer-controlled","Portability","Interactive (often)"], correct:2,
   explain:"The listed characteristics are combination, integration, computer-controlled, digital, and interactive (often) — portability isn't one of them."},

  {type:"objective", prompt:"In a linear multimedia experience such as a movie, the user is:",
   options:["A passive viewer","An active participant","The system administrator","The content author"], correct:0,
   explain:"Linear multimedia plays start to finish with the user as a passive viewer, unlike interactive/non-linear formats."},

  {type:"objective", prompt:"Which is an example of interactive / non-linear multimedia?",
   options:["A TV ad","A slideshow","A video game","A movie"], correct:2,
   explain:"A video game lets the user control navigation and pace, making it interactive/non-linear — unlike a movie, slideshow, or TV ad."},

  {type:"objective", prompt:"Media-editing tools such as image, audio, and video editors belong to which component category?",
   options:["Hardware","Software","Output devices","Network infrastructure"], correct:1,
   explain:"Media-editing tools are software — one of the two main component categories alongside hardware."},

  {type:"objective", prompt:"Cameras, microphones, and scanners belong to which component category?",
   options:["Input/capture hardware","Authoring software","Players and browsers","Adjustment layers"], correct:0,
   explain:"Cameras, mics, scanners, tablets, and recorders are input/capture hardware."},

  {type:"objective", prompt:"What is the first stage of the multimedia production pipeline?",
   options:["Content production","Analysis and planning","Integration","Testing"], correct:1,
   explain:"The pipeline runs analysis and planning → design → content production → integration → testing."},

  {type:"objective", prompt:"Digitalization is best described as:",
   options:["Converting an analog signal into discrete numbers","Compressing a digital file","Adding interactivity to static content","Converting vector graphics to raster"], correct:0,
   explain:"Digitalization is the process of converting an analog (continuous) signal into discrete digital numbers."},

  {type:"objective", prompt:"Why is digital media generally preferred over analog?",
   options:["Perfect copies, precise editing, and easy compression","Lower hardware cost only","It cannot be edited","It requires no storage"], correct:0,
   explain:"Digital media allows perfect copies, precise editing, compression, network transmission, and compact storage."},

  {type:"objective", prompt:"How many possible values can N bits represent?",
   options:["2ᴺ","N²","2 × N","N ÷ 2"], correct:0,
   explain:"N bits give 2ⁿ possible values — e.g. 8 bits give 2⁸ = 256 values."},

  {type:"objective", prompt:"ASCII uses 7 bits to represent how many characters?",
   options:["64","128","256","512"], correct:1,
   explain:"ASCII: 7 bits → 2⁷ = 128 characters, covering English letters, digits, and punctuation."},

  {type:"objective", prompt:"The Nyquist Sampling Theorem states that you must sample at:",
   options:["At least twice the highest frequency present","Exactly the highest frequency present","Half the highest frequency present","Any convenient rate"], correct:0,
   explain:"Sampling at least twice the highest frequency present is required to faithfully capture a signal — hence CDs sampling at 44,100 Hz for ~20,000 Hz hearing."},

  {type:"objective", prompt:"Unlike other media, text digitization works by:",
   options:["Being looked up in a character-encoding table, not sampled","Being sampled at 44,100 Hz","Being quantized into 256 levels","Being converted into vector paths"], correct:0,
   explain:"Each character maps to a number via a character-encoding scheme — text is looked up in a table, not sampled."},

  {type:"objective", prompt:"Video quality and file size rest on resolution, frame rate, and color depth. Which factor is NOT part of that group?",
   options:["Frame rate","Color depth","Typeface","Resolution"], correct:2,
   explain:"Video size depends on resolution, frame rate, and color depth (bits per pixel) — typeface is a text property, not a video one."},

  {type:"objective", prompt:"RGB is best described as:",
   options:["An additive color model used for screens","A subtractive color model used for print","A perceptual model for hand-picking colors","A vector file format"], correct:0,
   explain:"RGB mixes red, green, and blue light additively — combining all channels at full intensity produces white, which is why it's used for screens."},

  {type:"objective", prompt:"CMYK is used primarily for:",
   options:["Print","Screen display","Video streaming","Web fonts"], correct:0,
   explain:"CMYK mixes cyan, magenta, yellow, and black inks — the subtractive model used for physical printing."},

  {type:"objective", prompt:"HEX color notation is:",
   options:["RGB written in base-16 (hexadecimal)","A separate fifth color channel","Used only in CMYK printing","A vector file format"], correct:0,
   explain:"HEX (#RRGGBB) is simply RGB expressed in hexadecimal — each channel becomes two hex digits from 00 to FF."},

  {type:"objective", prompt:"PPI (pixels per inch) measures:",
   options:["Digital image/screen resolution density","Physical printer dot density","Video frame rate","Audio sample rate"], correct:0,
   explain:"PPI measures how densely pixels are packed in a digital image or screen; DPI is the printer equivalent."},

  {type:"objective", prompt:"Which file format is best for a logo that must scale to any size without quality loss?",
   options:["SVG","JPEG","GIF","WEBP"], correct:0,
   explain:"SVG is vector-based code, so it scales to any size with no quality loss — ideal for logos, icons, and type."},

  {type:"objective", prompt:"Which format offers lossless compression with alpha transparency, ideal for sharp text and logos?",
   options:["PNG","JPEG","MP4","CMYK"], correct:0,
   explain:"PNG is a lossless raster format with an alpha channel, making it well-suited to sharp edges, text, and logos that need transparency."},

  {type:"objective", prompt:"A Smart Object layer in Photoshop exists mainly to:",
   options:["Preserve the original data through repeated transforms","Flatten all layers permanently","Convert raster images to vector","Store the print color profile"], correct:0,
   explain:"Smart Objects protect the original data so that scaling and other transforms stay non-destructive and reversible."},

  // ---------------- COMPUTATION (10) ----------------
  {type:"computation", prompt:"Convert RGB (255, 165, 0) to a HEX color code.",
   matchType:"exact", accept:["ff a5 00","ffa500","#ffa500"],
   explain:"255 → FF, 165 → A5, 0 → 00, so RGB(255, 165, 0) = #FFA500."},

  {type:"computation", prompt:"Convert the hex color #00FF7F back into its RGB decimal values (R, G, B).",
   matchType:"numlist", target:[0,255,127],
   explain:"00 = 0, FF = 255, 7F = 127, so #00FF7F = RGB(0, 255, 127)."},

  {type:"computation", prompt:"With n = 10 bits, how many distinct values can be represented?",
   matchType:"approx", target:1024, tolerance:0,
   explain:"Values = 2ⁿ = 2¹⁰ = 1,024."},

  {type:"computation", prompt:"A microphone picks up frequencies up to 8,000 Hz. Per the Nyquist theorem, what is the minimum sampling rate needed, in Hz?",
   matchType:"approx", target:16000, tolerance:0,
   explain:"Nyquist requires sampling at least twice the highest frequency: 2 × 8,000 Hz = 16,000 Hz."},

  {type:"computation", prompt:"Calculate the uncompressed file size, in bytes, of an 800 × 600 image at 24-bit color depth.",
   matchType:"approx", target:1440000, tolerance:1000,
   explain:"size = w × h × bit depth = 800 × 600 × 24 = 11,520,000 bits ÷ 8 = 1,440,000 bytes."},

  {type:"computation", prompt:"Calculate the uncompressed size, in MB (1 decimal place), of 2 minutes of CD-quality stereo audio (44,100 Hz, 16-bit, 2 channels).",
   matchType:"approx", target:21.2, tolerance:0.3,
   explain:"size = rate × depth × channels × sec = 44,100 × 16 × 2 × 120 = 169,344,000 bits ÷ 8 = 21,168,000 bytes ≈ 21.2 MB."},

  {type:"computation", prompt:"How many bytes are needed to store one uncompressed frame of 1920 × 1080 video at 24-bit color depth?",
   matchType:"approx", target:6220800, tolerance:1000,
   explain:"size = 1920 × 1080 × 24 = 49,766,400 bits ÷ 8 = 6,220,800 bytes — the same formula used for a still image."},

  {type:"computation", prompt:"For uncompressed 1080p video at 24-bit color depth and 30 fps, what is the approximate data rate in MB per second (1 decimal place)?",
   matchType:"approx", target:186.6, tolerance:2,
   explain:"per second = 1920 × 1080 × 24 × 30 ÷ 8 = 186,624,000 bytes ≈ 186.6 MB/s."},

  {type:"computation", prompt:"A grayscale pixel is stored with 8 bits. How many distinct gray levels are possible?",
   matchType:"approx", target:256, tolerance:0,
   explain:"8 bits give 2⁸ = 256 possible levels — one color channel's worth of grayscale."},

  {type:"computation", prompt:"Convert the hex color #2E5496 back into its RGB decimal values (R, G, B).",
   matchType:"numlist", target:[46,84,150],
   explain:"2E = 46, 54 = 84, 96 = 150, so #2E5496 = RGB(46, 84, 150) — the reverse of the worked example in Module 2."}
];

/* ===================================================================
   RENDERING
   =================================================================== */
const root = document.getElementById("quiz-root");

QUESTIONS.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "qcard";
  card.dataset.index = i;

  const meta = document.createElement("div");
  meta.className = "qmeta";
  meta.innerHTML = `<span class="qtag ${q.type}">${q.type === "objective" ? "Objective" : "Computation"}</span><span class="qnum">Q${i + 1} / ${QUESTIONS.length}</span>`;
  card.appendChild(meta);

  const prompt = document.createElement("p");
  prompt.className = "prompt";
  prompt.textContent = q.prompt;
  card.appendChild(prompt);

  if (q.type === "objective") {
    const wrap = document.createElement("div");
    wrap.className = "options";
    q.options.forEach((opt, oi) => {
      const label = document.createElement("label");
      label.className = "option";
      label.innerHTML = `<input type="radio" name="q${i}" value="${oi}"> <span>${opt}</span>`;
      label.querySelector("input").addEventListener("change", updateProgress);
      wrap.appendChild(label);
    });
    card.appendChild(wrap);
  } else {
    const row = document.createElement("div");
    row.className = "compute-row";
    row.innerHTML = `<input type="text" id="q${i}" placeholder="Your answer">`;
    row.querySelector("input").addEventListener("input", updateProgress);
    card.appendChild(row);
  }

  const fb = document.createElement("div");
  fb.className = "feedback";
  fb.id = `fb${i}`;
  card.appendChild(fb);

  const ex = document.createElement("div");
  ex.className = "explain";
  ex.id = `ex${i}`;
  ex.textContent = q.explain;
  card.appendChild(ex);

  root.appendChild(card);
});

/* ===================================================================
   PROGRESS
   =================================================================== */
function updateProgress() {
  let answered = 0;
  QUESTIONS.forEach((q, i) => {
    if (q.type === "objective") {
      if (document.querySelector(`input[name="q${i}"]:checked`)) answered++;
    } else {
      const val = document.getElementById(`q${i}`).value.trim();
      if (val.length > 0) answered++;
    }
  });
  document.getElementById("progress-label").textContent = `${answered} / ${QUESTIONS.length} answered`;
  document.getElementById("progress-fill").style.width = `${(answered / QUESTIONS.length) * 100}%`;
}

/* ===================================================================
   GRADING
   =================================================================== */
function normalize(str) {
  return str.trim().toLowerCase().replace(/[#\s]/g, "");
}

function extractNumbers(str) {
  const matches = str.match(/-?\d+(\.\d+)?/g);
  return matches ? matches.map(Number) : [];
}

function checkComputation(q, raw) {
  if (q.matchType === "exact") {
    const n = normalize(raw);
    return q.accept.some(a => normalize(a) === n);
  }
  if (q.matchType === "approx") {
    const nums = extractNumbers(raw);
    if (nums.length === 0) return false;
    return Math.abs(nums[0] - q.target) <= q.tolerance;
  }
  if (q.matchType === "numlist") {
    const nums = extractNumbers(raw);
    if (nums.length !== q.target.length) return false;
    return nums.every((n, idx) => n === q.target[idx]);
  }
  return false;
}

document.getElementById("grade-btn").addEventListener("click", () => {
  let correctCount = 0;

  QUESTIONS.forEach((q, i) => {
    const fb = document.getElementById(`fb${i}`);
    const ex = document.getElementById(`ex${i}`);
    let isCorrect = false;

    if (q.type === "objective") {
      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      const labels = document.querySelectorAll(`#quiz-root .qcard[data-index="${i}"] .option`);
      labels.forEach((label, oi) => {
        label.classList.remove("correct", "incorrect");
        if (oi === q.correct) label.classList.add("correct");
        else if (chosen && Number(chosen.value) === oi) label.classList.add("incorrect");
      });
      isCorrect = chosen && Number(chosen.value) === q.correct;
    } else {
      const input = document.getElementById(`q${i}`);
      isCorrect = checkComputation(q, input.value);
      input.style.borderColor = isCorrect ? "var(--g)" : "var(--r)";
    }

    if (isCorrect) correctCount++;

    fb.textContent = isCorrect ? "Correct" : "Not quite — see the note below";
    fb.className = `feedback show ${isCorrect ? "right" : "wrong"}`;
    ex.className = "explain show";
  });

  const summary = document.getElementById("score-summary");
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  summary.innerHTML = `Score: <strong>${correctCount} / ${QUESTIONS.length}</strong> (${pct}%)`;

  document.querySelector(".quizbar").scrollIntoView({behavior: "smooth", block: "end"});
});

updateProgress();
</script>

</body>
</html>
